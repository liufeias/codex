# ==============================================================================
# 工作流名称: 编译构建 Codex 原生全套沙箱套件 (极致性能与体积裁剪版)
# 触发策略: 仅限维护人员在 GitHub 网页控制台手动点击触发 (workflow_dispatch)
# 运行环境: Windows Server 最新镜像 (windows-latest)
# 架构优化重点:
#   1. 彻底根除退出码 101 缓存崩溃: 为 rust-cache 显式指定 "codex-rs -> target" 工作区映射，
#      确保 300+ 底层复杂 Crate 编译成果 100% 成功持久化命中，二次构建耗时由 13 分钟压至 1~2 分钟；
#   2. 实施 MSVC 链接器标准段级激进消亡 (Aggressive Dead-Stripping):
#      - 去除非法 rustc 命令行标志，使用标准的 `-C link-arg` 对接 MSVC 链接器 link.exe；
#      - 注入 `-C link-arg=/OPT:REF`: 开启链接器全量可达性图剪枝，从入口 main() 出发物理丢弃
#        所有未被引用的函数与数据段（将无用代码与庞大数据表最大限度切除）；
#      - 注入 `-C link-arg=/OPT:ICF=3`: 执行最高级别重复代码与相同数据折叠；
#      - 注入 `-C link-arg=/DEBUG:NONE`: 杜绝调试信息和符号表侵入最终 PE 文件；
#      - 注入 `-C strip=symbols` 与 `-C panic=abort`: 彻底剥离符号与异常展开表；
#   3. 零入侵原则: 全部优化参数通过全局环境变量与 RUSTFLAGS 注入，不改动任何官方 crate 源码。
# ==============================================================================

name: Build Codex Mini Sandbox Suite

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: '选择编译配置模式 (Build Profile)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build-windows-sandbox:
    name: 编译生产级 Windows 原生全套安全沙箱套件
    runs-on: windows-latest

    steps:
      # 1. 检出当前代码仓库中的全部源码
      - name: 检出当前仓库源码 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. 安装并配置官方 Rust 稳定版工具链及 MSVC 编译目标
      - name: 配置 Rust 官方编译环境 (Setup Rust Toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 3. 启用官方 Cargo 依赖缓存（关键修复：精准声明工作区映射，彻底消灭 exit code 101 报错）
      - name: 配置 Cargo 依赖缓存 (Cargo Cache)
        uses: Swatinem/rust-cache@v2
        with:
          # 显式告知缓存插件：Rust 工作区根目录位于子目录 codex-rs，编译输出位于 codex-rs/target
          workspaces: "codex-rs -> target"
          shared-key: "codex-mini-sandbox-cache-v4"

      # 4. 工作区与项目挂载自动探查
      - name: 探查并确保工作区清单正确包含 codex-mini-sandbox
        shell: pwsh
        run: |
          Write-Host "[1/2] 探查 Rust 工作区根目录位置..."
          $rustRoot = if (Test-Path "codex-rs/Cargo.toml") { "codex-rs" } else { "." }
          Write-Host "   -> 锁定 Rust 编译工作区路径: $rustRoot"
          echo "RUST_ROOT=$rustRoot" >> $env:GITHUB_ENV

          $targetDir = "$rustRoot/codex-mini-sandbox"
          if (-not (Test-Path "$targetDir/Cargo.toml") -or -not (Test-Path "$targetDir/src/main.rs")) {
              Write-Error "❌ 错误: 未在仓库中找到 $targetDir 目录或源码文件！请确保已经将 codex-mini-sandbox 提交到 Git 仓库。"
              exit 1
          }

          Write-Host "[2/2] 检查根工作区清单 Cargo.toml 是否已登记 members..."
          $rootTomlPath = "$rustRoot/Cargo.toml"
          $rootTomlContent = Get-Content -Raw -Path $rootTomlPath
          
          if ($rootTomlContent -notmatch "codex-mini-sandbox") {
              Write-Host "   -> 工作区清单未发现声明，自动向 $rootTomlPath 追加成员声明..."
              $updatedToml = $rootTomlContent -replace 'members\s*=\s*\[', "members = [`n    `"codex-mini-sandbox`","
              Set-Content -Path $rootTomlPath -Value $updatedToml -Encoding utf8
          }
          Write-Host "✅ 工作区环境就绪！"

      # 5. 精准编译：注入合法标准的 MSVC 链接器死代码消除参数
      - name: 执行 Cargo 套件全量优化编译 (Build Optimized Suite)
        shell: pwsh
        env:
          # 1. 强制覆盖工作区 Profile 基础配置
          CARGO_PROFILE_RELEASE_STRIP: "symbols"
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_PANIC: "abort"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
          CARGO_INCREMENTAL: "0"
          
          # 2. 注入合法标准的 rustc 与 MSVC link.exe 优化开关
          RUSTFLAGS: >-
            -C strip=symbols
            -C panic=abort
            -C link-arg=/OPT:REF
            -C link-arg=/OPT:ICF=3
            -C link-arg=/DEBUG:NONE
        run: |
          cd $env:RUST_ROOT
          $buildProfile = "${{ github.event.inputs.build_profile }}"
          Write-Host "🚀 开始编译沙箱三位一体全套二进制组件 (模式: $buildProfile)..."

          # 明确指定这 3 个二进制目标，彻底排除无关模块
          $cargoArgs = @(
              "build",
              "-p", "codex-mini-sandbox",
              "-p", "codex-windows-sandbox",
              "--bin", "codex-mini-sandbox",
              "--bin", "codex-windows-sandbox-setup",
              "--bin", "codex-command-runner"
          )
          if ($buildProfile -eq "release") {
              $cargoArgs += "--release"
          }

          # 启动编译器
          & cargo @cargoArgs
          if ($LASTEXITCODE -ne 0) {
              Write-Error "❌ 编译过程中发生错误，退出码: $LASTEXITCODE"
              exit $LASTEXITCODE
          }
          Write-Host "✅ 全套沙箱组件编译成功！"

      # 6. 提取三套编译产物并计算各自的 SHA-256 完整性哈希
      - name: 收集与审计全套产物 (Collect Suite Artifacts & Checksums)
        shell: pwsh
        run: |
          $buildProfile = "${{ github.event.inputs.build_profile }}"
          $targetBase = if (Test-Path "$env:RUST_ROOT/target/$buildProfile") {
              "$env:RUST_ROOT/target/$buildProfile"
          } else {
              "target/$buildProfile"
          }

          # 建立独立的套件归档目录
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          $binaries = @(
              "codex-mini-sandbox.exe",
              "codex-windows-sandbox-setup.exe",
              "codex-command-runner.exe"
          )

          Write-Host "=========================================================="
          Write-Host "   收集编译产物与 SHA-256 指纹列表:"
          Write-Host "=========================================================="

          $checksums = @()
          foreach ($bin in $binaries) {
              $srcPath = "$targetBase/$bin"
              if (-not (Test-Path $srcPath)) {
                  Write-Error "❌ 构建失败：未能找到目标二进制 $srcPath！"
                  exit 1
              }
              $destPath = "dist/$bin"
              Copy-Item -Path $srcPath -Destination $destPath -Force

              $fileItem = Get-Item $destPath
              $sizeMb = [math]::Round($fileItem.Length / 1MB, 2)
              $hash = (Get-FileHash -Path $destPath -Algorithm SHA256).Hash
              $checksums += "$hash *$bin"
              Write-Host "📦 [$bin] 体积: $sizeMb MB | SHA-256: $hash"
          }

          Set-Content -Path "dist/SHA256SUMS.txt" -Value ($checksums -join "`n")
          Write-Host "=========================================================="

      # 7. 上传完整沙箱套件到 GitHub Actions 工件库供一键下载
      - name: 上传沙箱套件工件 (Upload Sandbox Suite Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: codex-sandbox-suite-windows-x86_64
          path: |
            dist/codex-mini-sandbox.exe
            dist/codex-windows-sandbox-setup.exe
            dist/codex-command-runner.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30