# ==============================================================================
# 文件路径: codex-rs/codex-mini-sandbox/Cargo.toml
# 功能描述: 深度修剪不必要依赖、快速构建的独立受限令牌沙箱工程配置
# 优化重点:
#   1. 补齐 SpawnedProcess 运行时进程抽象所需依赖: 对接工作区公共 utils/pty；
#   2. 配合 MSVC 链接器参数: 在编译期生成可细粒度打散的 COMDAT 目标文件；
#   3. 精准依赖对接: 直接对接 Codex 仓库官方底层沙箱组件 windows-sandbox-rs。
# ==============================================================================

[package]
name = "codex-mini-sandbox"
version = "0.1.0"
edition = "2021"
authors = ["Codex Sandbox Agent Team"]
description = "Lean, Production-Grade 100% Official-Parity Windows Native Sandbox Runner"

[dependencies]
# 统一错误上下文包装库
anyhow = "1.0"

# 官方对齐的时间戳格式化（仅开启最小必要 feature）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 工业级命令行参数解析库（严格对齐官方 clap 规范）
clap = { version = "4.4", features = ["derive"] }

# Windows 物理绝对路径规范化（消除短路径名 8.3 格式与符号链接安全盲区）
dunce = "1.0"

# 序列化支持
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 异步系统运行时（严格裁剪为最小运行模块）
tokio = { version = "1.35", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

# 官方配置文件解析支持
toml = "0.8"

# 系统可执行文件快速探测
which = "6.0"

# 直接对接 Codex 仓库官方提供的安全沙箱核心组件、进程抽象与路径工具
codex-windows-sandbox = { path = "../windows-sandbox-rs" }
codex-protocol = { path = "../protocol" }
codex-utils-absolute-path = { path = "../utils/absolute-path" }
codex-utils-pty = { path = "../utils/pty" }

# Windows 原生安全对象与访问控制列表 Win32 接口
[target.'cfg(windows)'.dependencies.windows-sys]
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Console",
]
workspace = true