# ==============================================================================
# 文件路径: codex-rs/codex-mini-sandbox/Cargo.toml
# 功能描述: 100% 对齐官方行为的独立 Windows 原生安全沙箱执行器工程清单
# 设计哲学:
#   1. 纯净剥离: 彻底排除 Google V8、WezTerm 等 300MB+ 臃肿模块，保留 100% 原生沙箱能力；
#   2. 官方原生: 直接对接底层 windows-sandbox-rs 与 protocol crate，内核凭据分毫不差；
#   3. 工业级优化: 开启 LTO 与符号剥离，体积控制在 ~2MB，冷启动速度 < 2ms。
# ==============================================================================

[package]
name = "codex-mini-sandbox"
version = "0.1.0"
edition = "2021"
authors = ["Local Sandbox Agent Team"]
description = "100% Official-Feature-Parity Windows Native Sandbox Runner for Codex"

[dependencies]
# 错误上下文包装
anyhow = "1.0"

# 时间戳处理与每日滚动日志格式化（对齐官方 sandbox.YYYY-MM-DD.log）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 命令行参数解析（支持宽松语法与别名）
clap = { version = "4.4", features = ["derive"] }

# Windows 长路径与 UNC 规范化工具
dunce = "1.0"

# 序列化支持
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 异步系统运行时（用于与底层沙箱异步事件和流式 I/O 桥接）
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "sync"] }

# TOML 配置解析器（用于解析 CODEX_HOME/config.toml 中的沙箱模式）
toml = "0.8"

# 直接依赖 Codex 仓库内部的安全沙箱与协议 Crate（保证内核逻辑绝对一致）
codex-windows-sandbox = { path = "../windows-sandbox-rs" }
codex-protocol = { path = "../protocol" }
codex-utils-absolute-path = { path = "../utils/absolute-path" }

# 生产级构建优化配置
[profile.release]
opt-level = 3          # 最高级别编译器优化
lto = true             # 开启跨 Crate 链接时优化 (LTO)
codegen-units = 1      # 缩减生成单元以最大化内联效果
panic = "abort"        # 遇恐慌直接中止，精简展开表
strip = true           # 剥离所有调试符号，压榨产物体积